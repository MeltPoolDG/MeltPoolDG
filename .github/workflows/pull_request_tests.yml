name: Pull request run of GitHub CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

env:
  COMPILE_JOBS: 4
  PROJECT_NAME: MeltPoolDG
  CTEST_COMMAND: ctest

jobs:

  # ---------------------------------------------------------------------------
  # Fetch CURRENT labels from GitHub
  # ---------------------------------------------------------------------------

  labels:
    name: Determine current PR labels
    runs-on: ubuntu-latest

    outputs:
      ready_to_test: ${{ steps.labels.outputs.ready_to_test }}
      no_adaflo: ${{ steps.labels.outputs.no_adaflo }}
      enable_benchmarking: ${{ steps.labels.outputs.enable_benchmarking }}
      ctest_command: ${{ steps.labels.outputs.ctest_command }}
      make_targets: ${{ steps.labels.outputs.make_targets }}

    steps:
      - name: Get current PR labels
        id: labels
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          LABELS=$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels?per_page=100" \
              --jq '.[].name'
          )

          echo "=== Current labels ==="
          printf '%s\n' "$LABELS"
          echo "======================"

          # -------------------------------------------------------------------
          # Check whether CI should run
          # -------------------------------------------------------------------
          READY_TO_TEST=false

          if printf '%s\n' "$LABELS" | grep -Fxq "ready to test"; then
            READY_TO_TEST=true
          fi

          # -------------------------------------------------------------------
          # Check whether adaflo should be disabled
          # -------------------------------------------------------------------
          NO_ADAFLO=false

          if printf '%s\n' "$LABELS" | grep -Fxq "no_adaflo"; then
            NO_ADAFLO=true
          fi

          # -------------------------------------------------------------------
          # Check whether benchmarks should be enabled
          # -------------------------------------------------------------------
          WITH_BENCHMARKS=false

          if printf '%s\n' "$LABELS" | grep -Fxq "enable_benchmarking"; then
            WITH_BENCHMARKS=true
          fi

          # -------------------------------------------------------------------
          # Every mp-* label becomes a make target
          # -------------------------------------------------------------------
          MAKE_TARGETS=$(
            printf '%s\n' "$LABELS" \
              | grep '^mp-' \
              | paste -sd ' ' - || true
          )

          # -------------------------------------------------------------------
          # Selected labels become CTest filters
          # -------------------------------------------------------------------
          TEST_FILTER=$(
            printf '%s\n' "$LABELS" \
              | grep -E '^(mp-advec-diff|mp-heat-transfer|mp-radiative-transport|mp-reinit|mp-level-set|mp-melt-pool|unit_tests)$' \
              | paste -sd '|' - || true
          )

          if [[ -z "$TEST_FILTER" ]]; then
            FINAL_CTEST_COMMAND="${{ env.CTEST_COMMAND }}"
          else
            FINAL_CTEST_COMMAND="${{ env.CTEST_COMMAND }} -R ${TEST_FILTER}"
          fi

          echo
          echo "=== CI configuration ==="
          echo "ready to test  : $READY_TO_TEST"
          echo "no_adaflo      : $NO_ADAFLO"
          echo "make targets   : '$MAKE_TARGETS'"
          echo "enable_benchmarking: $WITH_BENCHMARKS"
          echo "ctest command  : $FINAL_CTEST_COMMAND"
          echo "========================"

          echo "ready_to_test=$READY_TO_TEST" >> "$GITHUB_OUTPUT"
          echo "no_adaflo=$NO_ADAFLO" >> "$GITHUB_OUTPUT"
          echo "enable_benchmarking=$WITH_BENCHMARKS" >> "$GITHUB_OUTPUT"
          echo "make_targets=$MAKE_TARGETS" >> "$GITHUB_OUTPUT"
          echo "ctest_command=$FINAL_CTEST_COMMAND" >> "$GITHUB_OUTPUT"


  # ---------------------------------------------------------------------------
  # Build and test
  # ---------------------------------------------------------------------------

  build:
    needs: labels

    if: ${{ needs.labels.outputs.ready_to_test == 'true' }}

    name: Build ${{ matrix.build_type }}-dealii:${{ matrix.dealii_version }}
    runs-on: self-hosted

    env:
      CTEST_COMMAND: ${{ needs.labels.outputs.ctest_command }}
      MAKE_TARGETS: ${{ needs.labels.outputs.make_targets }}
      NO_ADAFLO: ${{ needs.labels.outputs.no_adaflo }}
      MPDG_ENABLE_BENCHMARKING: ${{ needs.labels.outputs.enable_benchmarking == 'true' && 'ON' || 'OFF' }}

    strategy:
      fail-fast: false
      matrix:
        build_type: ["Release"]
        dealii_version: ["master"]

    # -------------------------------------------------------------------------
    # With adaflo:
    #   ghcr.io/meltpooldg/adaflo:latest
    #
    # With label "no_adaflo":
    #   dealii/dealii:master-noble
    # -------------------------------------------------------------------------
    container:
      image: ${{ needs.labels.outputs.no_adaflo == 'true' && 'dealii/dealii:master-noble' || 'ghcr.io/meltpooldg/adaflo:latest' }}
      options: --user root

    steps:
      - uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Show CI configuration
      # -----------------------------------------------------------------------
      - name: Show CI configuration
        shell: bash
        run: |
          echo "no_adaflo   : '${NO_ADAFLO}'"
          echo "Make targets: '${MAKE_TARGETS}'"
          echo "CTest command: '${CTEST_COMMAND}'"

          if [[ "$NO_ADAFLO" == "true" ]]; then
            echo "Docker image: dealii/dealii:master-noble"
          else
            echo "Docker image: ghcr.io/meltpooldg/adaflo:latest"
            echo "ADAFLO_LIB: '${ADAFLO_LIB}'"
            echo "ADAFLO_INCLUDE: '${ADAFLO_INCLUDE}'"
          fi

      # -----------------------------------------------------------------------
      # Compile MeltPoolDG
      # -----------------------------------------------------------------------
      - name: Compile MeltPoolDG
        shell: bash
        run: |
          mkdir build
          cd build

          CMAKE_ARGS=(
            -D CMAKE_CXX_STANDARD=20
            -D CMAKE_CXX_FLAGS="-Werror"
            -D CMAKE_BUILD_TYPE=${{ matrix.build_type }}
            -D MPDG_ENABLE_BENCHMARKING=${MPDG_ENABLE_BENCHMARKING} \
          )

          if [[ "$NO_ADAFLO" != "true" ]]; then
            CMAKE_ARGS+=(
              -D ADAFLO_LIB="${ADAFLO_LIB}"
              -D ADAFLO_INCLUDE="${ADAFLO_INCLUDE}"
            )
          fi

          echo
          echo "CMake configuration:"
          printf '  %q\n' "${CMAKE_ARGS[@]}"
          echo

          cmake "${CMAKE_ARGS[@]}" ..

          echo
          echo "Make command:"
          echo "make -j${{ env.COMPILE_JOBS }} ${MAKE_TARGETS}"
          echo

          make -j${{ env.COMPILE_JOBS }} ${MAKE_TARGETS}

      # -----------------------------------------------------------------------
      # Run tests
      # -----------------------------------------------------------------------
      - name: Test
        shell: bash
        run: |
          export HWLOC_HIDE_ERRORS=2
          export OMPI_ALLOW_RUN_AS_ROOT=1
          export OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1

          cd build

          echo
          echo "CTest command:"
          echo "$CTEST_COMMAND -j${{ env.COMPILE_JOBS }} --output-on-failure"
          echo

          $CTEST_COMMAND \
            -j${{ env.COMPILE_JOBS }} \
            --output-on-failure

      # -----------------------------------------------------------------------
      # Upload output from failed tests
      # -----------------------------------------------------------------------
      - name: Failed test log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: |
            build/**/{tests,unit_tests}/**/*{stdout,output}*


  # ---------------------------------------------------------------------------
  # Cleanup
  # ---------------------------------------------------------------------------

  clean:
    needs: [labels, build]

    if: ${{ always() && needs.labels.outputs.ready_to_test == 'true' }}

    runs-on: self-hosted

    env:
      ACTIONS_RUNNER_DEBUG: true
      ACTIONS_STEP_DEBUG: true

    steps:
      - name: Prune Docker system
        shell: bash
        run: |
          docker system prune -af
